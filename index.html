:root[data-theme="dark"]{--bg:#0d1b1f;--surf:#14272c;--ink:#e6f0f2;--mute:#9bb2b8;--line:#274249;--water:#4cc3d6;--warn:#ff8a7a;--warnbg:#3a1a17;--ok:#5fd39a;--amber:#f0b04a;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;padding:16px}
main{max-width:980px;margin:0 auto}
h1{font:700 1.9rem/1.15 Georgia,"Times New Roman",serif;margin:0 0 4px}
h2{font:700 1.15rem/1.3 Georgia,serif;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.note{border-left:4px solid var(--amber);background:var(--surf);padding:10px 14px;border-radius:4px;margin:0 0 16px;font-size:.95rem}
.warns{display:grid;gap:8px}
.warn{background:var(--warnbg);border:2px solid var(--warn);color:var(--ink);border-radius:6px;padding:10px 14px;display:flex;gap:12px;align-items:flex-start;animation:flash 1.4s ease-in-out infinite}
.warn b{color:var(--warn)}
.warn small{display:block;color:var(--mute)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--warn);margin-top:7px}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px var(--warn);}}
@media (prefers-reduced-motion:reduce){.warn{animation:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.card span{color:var(--mute);font-size:.9rem}
a{color:var(--water);font-weight:600}
a:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

.tl li{background:var(--surf);border:1px solid var(--line);border-radius:6px;margin:0 0 10px 14px;padding:10px 14px;position:relative}
